[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "donchian-tradingbot"
version = "0.1.0"
description = "Specification-first Donchian breakout research components"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.2.3",
    "PyYAML==6.0.3",
    "pyarrow==21.0.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
